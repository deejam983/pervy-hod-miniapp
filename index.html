<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Первый Ход — ключ доступа</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #F5F7F5; color: #1B2024;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #5B655F; line-height: 1.45; margin: 0 0 16px; }
  textarea {
    width: 100%; height: 150px; padding: 12px;
    border: 1px solid #C8D0CA; border-radius: 10px;
    font-family: Consolas, monospace; font-size: 13px;
    background: #fff; color: #1B2024; resize: vertical;
  }
  button {
    margin-top: 12px; padding: 12px 20px; border: 0; border-radius: 10px;
    background: #8F510A; color: #fff; font-size: 16px; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .status { margin: 12px 0; font-weight: 600; }
  .error { color: #A33A2B; }
  .note { font-size: 13px; color: #5B655F; margin-top: 16px; }
</style>
</head>
<body>
  <h1>Первый Ход — ключ доступа</h1>
  <p>Приложение запросит права на управление сообществом. После разрешения ключ
     появится ниже — скопируйте его и отправьте владельцу в личном сообщении.</p>

  <div class="status" id="status">Запрашиваю доступ…</div>
  <textarea id="token" readonly placeholder="Ключ появится здесь"></textarea>
  <button id="copy" disabled>Скопировать ключ</button>
  <div class="note" id="scope"></div>
  <div class="note">Не делайте скриншот с ключом и не публикуйте его.</div>

  <script src="vk-bridge.js"></script>
  <script>
    const APP_ID = Number('54839100');
    const SCOPES = 'market,stats,groups,photos,wall,docs,stories';

    const statusEl = document.getElementById('status');
    const tokenEl = document.getElementById('token');
    const copyEl = document.getElementById('copy');
    const scopeEl = document.getElementById('scope');

    async function main() {
      if (!APP_ID) {
        statusEl.textContent = 'Ошибка: не задан ID мини-приложения.';
        statusEl.className = 'status error';
        return;
      }
      try {
        await vkBridge.send('VKWebAppInit');
        const data = await vkBridge.send('VKWebAppGetAuthToken', {
          app_id: APP_ID,
          scope: SCOPES,
        });
        tokenEl.value = data.access_token || '';
        copyEl.disabled = !tokenEl.value;
        statusEl.textContent = 'Ключ получен. Скопируйте и отправьте в личку.';
        const expires = data.expires
          ? new Date(data.expires * 1000).toLocaleString('ru-RU')
          : 'не указан';
        scopeEl.textContent = `Права: ${data.scope || '—'} · действует до: ${expires}`;
      } catch (error) {
        statusEl.textContent = 'Не удалось получить ключ: ' + JSON.stringify(error);
        statusEl.className = 'status error';
      }
    }

    copyEl.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(tokenEl.value);
        copyEl.textContent = 'Скопировано';
      } catch {
        tokenEl.select();
        document.execCommand('copy');
        copyEl.textContent = 'Скопировано';
      }
    });

    main();
  </script>
</body>
</html>
